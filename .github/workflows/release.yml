name: Build desktop installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build React UI
        run: npm run build
      - name: Package Windows installer and portable
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test unpacked packaged app
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'smoke-unpacked.json'
          $env:DOMINION_SMOKE='1'
          $env:DOMINION_SMOKE_OUT=$out
          $p = Start-Process -FilePath '.\release\win-unpacked\DOMINION.exe' -ArgumentList '--smoke' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Unpacked smoke exited $($p.ExitCode)" }
          Get-Content $out -Raw
          $result = Get-Content $out -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw 'Unpacked smoke failed' }
      - name: Silent install and smoke test installed app
        shell: pwsh
        run: |
          $installer = '.\release\DOMINION-Setup.exe'
          $p = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\DOMINION\DOMINION.exe'
          if (-not (Test-Path $exe)) { throw "Installed executable missing: $exe" }
          $out = Join-Path $PWD 'smoke-installed.json'
          $env:DOMINION_SMOKE='1'
          $env:DOMINION_SMOKE_OUT=$out
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installed smoke exited $($p.ExitCode)" }
          Get-Content $out -Raw
          $result = Get-Content $out -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw 'Installed smoke failed' }
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dominion-windows
          path: |
            release/DOMINION-Setup.exe
            release/DOMINION-Portable.exe
          if-no-files-found: error

  macos:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build React UI
        run: npm run build
      - name: Package macOS DMGs (arm64 + x64, unsigned)
        run: npx electron-builder --mac --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify DMGs by mounting and smoke testing
        run: |
          set -e
          for arch in arm64 x64; do
            dmg=$(ls release/DOMINION-*-${arch}.dmg | head -n1)
            test -f "$dmg"
            mount="/tmp/dominion-${arch}"
            rm -rf "$mount" "/tmp/DOMINION-${arch}.app"
            mkdir -p "$mount"
            hdiutil attach "$dmg" -nobrowse -mountpoint "$mount"
            cp -R "$mount/DOMINION.app" "/tmp/DOMINION-${arch}.app"
            hdiutil detach "$mount"
            xattr -dr com.apple.quarantine "/tmp/DOMINION-${arch}.app" || true
            DOMINION_SMOKE=1 DOMINION_SMOKE_OUT="/tmp/smoke-${arch}.json" \
              "/tmp/DOMINION-${arch}.app/Contents/MacOS/DOMINION" --smoke
            cat "/tmp/smoke-${arch}.json"
            node -e "const x=require('/tmp/smoke-${arch}.json'); if(!x.ok)process.exit(1)"
          done
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dominion-macos
          path: release/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dominion-windows
          path: artifacts/windows
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: dominion-macos
          path: artifacts/macos
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/windows/DOMINION-Setup.exe
            artifacts/windows/DOMINION-Portable.exe
            artifacts/macos/*.dmg
          fail_on_unmatched_files: true
